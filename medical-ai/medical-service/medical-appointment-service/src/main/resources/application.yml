server:
  port: 8084

spring:
  application:
    name: medical-appointment-service
  config:
    import: optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension:yml}
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
    sentinel:
      enabled: true
      eager: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/medical_appointment?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-concurrent: true
  is-share: true
  is-read-cookie: false
  is-read-header: true

security:
  internal-api:
    secret: ${SECURITY_INTERNAL_API_SECRET:local-dev-internal-secret}

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: medical_tx_group
  service:
    vgroupMapping:
      medical_tx_group: default
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      group: SEATA_GROUP
      namespace: ""
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      group: SEATA_GROUP
      namespace: ""
  client:
    tm:
      default-global-transaction-timeout: 30000

medical:
  mq:
    enabled: true
    exchange: medical.event
    notification-queue: medical.notification.queue
    notification-dlq: medical.notification.dlq
    metrics-queue: medical.metrics.queue
    metrics-dlq: medical.metrics.dlq
    audit-queue: medical.audit.queue
    audit-dlq: medical.audit.dlq
    publish-claim-timeout-seconds: 120
    publish-confirm-timeout-seconds: 10
