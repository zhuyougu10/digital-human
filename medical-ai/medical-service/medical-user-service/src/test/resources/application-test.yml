spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    loadbalancer:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379

sa-token:
  token-name: Authorization
  token-prefix: Bearer

security:
  internal-api:
    secret: test-internal-secret

# 禁用 Knife4j
springdoc:
  api-docs:
    enabled: false
