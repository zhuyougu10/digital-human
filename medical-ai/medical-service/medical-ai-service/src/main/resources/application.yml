server:
  port: 8083

spring:
  application:
    name: medical-ai-service
  config:
    import: optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension:yml}
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
    sentinel:
      enabled: true
      eager: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/medical_ai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-key}
      base-url: https://api.deepseek.com

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-key}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  qwen:
    api-key: ${DASHSCOPE_API_KEY:your-dashscope-key}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus

tts:
  audio-path: ${TTS_AUDIO_PATH:D:/project/数字人/tts-audio}
  mimo:
    api-key: ${MIMO_API_KEY:your-mimo-key}
    base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
    model: ${MIMO_TTS_MODEL:mimo-v2-tts}
    voice: ${MIMO_TTS_VOICE:mimo_default}
    format: ${MIMO_TTS_FORMAT:wav}
    connect-timeout-ms: ${MIMO_TTS_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${MIMO_TTS_READ_TIMEOUT_MS:30000}
    mp3-bitrate: ${MIMO_TTS_MP3_BITRATE:128}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-concurrent: true
  is-share: true
  is-read-cookie: false
  is-read-header: true

security:
  internal-api:
    secret: ${SECURITY_INTERNAL_API_SECRET:local-dev-internal-secret}
