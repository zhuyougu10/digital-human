server:
  port: 8080

spring:
  application:
    name: medical-gateway
  config:
    import: optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension:yml}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      routes:
        - id: ai-service-sse
          uri: lb://medical-ai-service
          predicates:
            - Path=/api/ai/chat/send
          filters:
            - StripPrefix=2
          metadata:
            response-timeout: 120000
            connect-timeout: 5000
        - id: user-service
          uri: lb://medical-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: doctor-service
          uri: lb://medical-doctor-service
          predicates:
            - Path=/api/doctor/**
          filters:
            - StripPrefix=2
        - id: ai-service
          uri: lb://medical-ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2
        - id: appointment-service
          uri: lb://medical-appointment-service
          predicates:
            - Path=/api/appointment/**
          filters:
            - StripPrefix=2
        - id: knowledge-service
          uri: lb://medical-knowledge-service
          predicates:
            - Path=/api/knowledge/**
          filters:
            - StripPrefix=2
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-concurrent: true
  is-share: true
  is-read-cookie: false
  is-read-header: true
