services:
  mysql:
    image: mysql:8.0
    container_name: medical-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/init/seata-init.sql:/docker-entrypoint-initdb.d/seata-init.sql
      - ./mysql/init/undo-log-init.sql:/docker-entrypoint-initdb.d/undo-log-init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4'
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medical-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: medical-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: medical-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: medical-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.5
    container_name: medical-milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]

  seata-server:
    image: apache/seata-server:2.1.0
    container_name: seata-server
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      - SEATA_STORE_MODE=db
      - SEATA_STORE_DB_DATASOURCE=druid
      - SEATA_STORE_DB_DB_TYPE=mysql
      - SEATA_STORE_DB_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SEATA_STORE_DB_URL=jdbc:mysql://mysql:3306/seata?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      - SEATA_STORE_DB_USER=${MYSQL_USER:-root}
      - SEATA_STORE_DB_PASSWORD=${MYSQL_PASSWORD:-root123}
      - SEATA_PORT=8091
      - CONSOLE_PORT=7091
      - SEATA_REGISTRY_TYPE=nacos
      - SEATA_REGISTRY_NACOS_SERVER_ADDR=nacos:8848
      - SEATA_REGISTRY_NACOS_GROUP=SEATA_GROUP
      - SEATA_REGISTRY_NACOS_CLUSTER=default
      - SEATA_REGISTRY_NACOS_NAMESPACE=
      - SEATA_CONFIG_TYPE=nacos
      - SEATA_CONFIG_NACOS_SERVER_ADDR=nacos:8848
      - SEATA_CONFIG_NACOS_GROUP=SEATA_GROUP
      - SEATA_CONFIG_NACOS_NAMESPACE=
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7091/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build: ../medical-gateway
    container_name: medical-gateway
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
      REDIS_HOST: ${REDIS_HOST:-redis}

  user-service:
    build: ../medical-service/medical-user-service
    container_name: medical-user-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      nacos:
        condition: service_healthy
    environment:
      NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}

  doctor-service:
    build: ../medical-service/medical-doctor-service
    container_name: medical-doctor-service
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      seata-server:
        condition: service_healthy
    environment:
      NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

  ai-service:
    build: ../medical-service/medical-ai-service
    container_name: medical-ai-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      nacos:
        condition: service_healthy
      milvus:
        condition: service_started
    environment:
      NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      ALIYUN_AK_ID: ${ALIYUN_AK_ID:-}
      ALIYUN_AK_SECRET: ${ALIYUN_AK_SECRET:-}
      ALIYUN_TTS_APPKEY: ${ALIYUN_TTS_APPKEY:-}

  appointment-service:
    build: ../medical-service/medical-appointment-service
    container_name: medical-appointment-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      nacos:
        condition: service_healthy
      seata-server:
        condition: service_healthy
    environment:
      NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

  knowledge-service:
    build: ../medical-service/medical-knowledge-service
    container_name: medical-knowledge-service
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      milvus:
        condition: service_started
    environment:
      NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}

  admin-web:
    build: ../../medical-admin
    container_name: medical-admin-web
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_started

  live2d-h5:
    build: ../../medical-mp/live2d-h5
    container_name: medical-live2d-h5
    ports:
      - "8090:8090"

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
