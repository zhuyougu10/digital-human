<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AI问诊</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* 医疗专业配色方案 */
            --primary-blue: #2563eb;
            --primary-light: #eff6ff;
            --medical-teal: #0d9488;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --bg-light: #f8faff;
            --glass-white: rgba(255, 255, 255, 0.85);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(37, 99, 235, 0.08);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.08);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #eef2f7;
            /* 柔和的医疗质感背景 */
            background-image: 
                radial-gradient(at 0% 0%, hsla(210, 100%, 98%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(190, 100%, 95%, 1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(220, 100%, 94%, 1) 0, transparent 50%);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 数字人展示区域 */
        #live2d-zone {
            height: 52vh;
            width: 100%;
            position: relative;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #live2d-canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: auto;
        }

        canvas {
            background: transparent !important;
        }

        /* 医生信息卡片 - 精致毛玻璃 */
        #doctor-info {
            position: absolute;
            top: 24px;
            right: 20px;
            z-index: 10;
            background: var(--glass-white);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            pointer-events: auto;
        }

        #doctor-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        #status-text {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            position: relative;
        }

        #status-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: inherit;
            animation: ripple 2s infinite;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* 聊天互动区域 */
        #chat-zone {
            flex: 1;
            background: white;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.04);
            position: relative;
            z-index: 2;
            margin-top: -30px;
        }

        #message-list {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        #message-list::-webkit-scrollbar {
            width: 0px;
        }

        /* Markdown 渲染样式 */
        .bubble h1, .bubble h2, .bubble h3 { margin: 8px 0 4px; font-weight: 600; }
        .bubble h1 { font-size: 1.2em; }
        .bubble h2 { font-size: 1.1em; }
        .bubble h3 { font-size: 1.05em; }
        .bubble p { margin: 4px 0; line-height: 1.6; }
        .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
        .bubble li { margin: 2px 0; }
        .bubble code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .bubble pre { background: rgba(0,0,0,0.06); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
        .bubble pre code { background: none; padding: 0; }
        .bubble blockquote { border-left: 3px solid #2563eb; padding-left: 12px; margin: 8px 0; color: #64748b; }
        .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; }
        .bubble th, .bubble td { border: 1px solid #e2e8f0; padding: 6px 10px; text-align: left; }
        .bubble th { background: #f1f5f9; font-weight: 600; }
        .bubble strong { font-weight: 600; }
        .bubble a { color: #2563eb; text-decoration: none; }

        /* 医生推荐卡片样式 */
        .doctor-card {
            background: linear-gradient(135deg, #f0f7ff 0%, #e8f4fd 100%);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .doctor-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .doctor-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }
        .doctor-card .doctor-name {
            font-weight: 600;
            font-size: 15px;
            color: #1e293b;
        }
        .doctor-card .doctor-dept {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }
        .doctor-card-body {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e2e8f0;
        }
        .doctor-card .doctor-specialty {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
        }

        /* 消息基础样式 */
        .msg {
            display: flex;
            max-width: 85%;
            animation: bubbleUp 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.1) forwards;
        }

        @keyframes bubbleUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg.ai {
            align-self: flex-start;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        /* 用户气泡 - 现代蓝渐变 */
        .user .bubble {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.15);
        }

        /* AI 气泡 */
        .ai .bubble {
            background: var(--primary-light);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        /* AI 加载态：气泡内容为空时显示跳动点 */
        .ai .bubble:empty {
            min-width: 60px;
            min-height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ai .bubble:empty::after {
            content: '···';
            letter-spacing: 4px;
            font-size: 20px;
            color: var(--text-sub);
            animation: loadingDots 1.2s steps(4, end) infinite;
        }
        @keyframes loadingDots {
            0%   { opacity: .2; }
            50%  { opacity: 1; }
            100% { opacity: .2; }
        }

        /* 时间戳样式 */
        .msg-time {
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 4px;
            display: block;
            text-align: center;
            opacity: 0.7;
        }

        /* 输入区域 */
        #input-bar {
            padding: 6px 16px calc(6px + var(--safe-area-bottom));
            background: white;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #f1f5f9;
        }

        #chat-input {
            flex: 1;
            height: 36px;
            background: #f1f5f9;
            border: 1.5px solid transparent;
            border-radius: 18px;
            padding: 0 16px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.25s ease;
        }

        #chat-input:focus {
            background: white;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.06);
        }

        #send-btn {
            width: 36px;
            height: 36px;
            background: var(--primary-blue);
            border: none;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
            flex-shrink: 0;
        }

        #send-btn:active {
            transform: scale(0.9);
            filter: brightness(0.9);
        }

        #send-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: translateX(1px);
        }

        /* 正在输入动画 */
        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 4px;
            align-items: center;
        }

        .typing span {
            width: 5px;
            height: 5px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 免责声明提示 */
        .disclaimer {
            font-size: 10px;
            color: #94a3b8;
            text-align: center;
            padding: 2px 0;
            background: white;
        }

        /* 上滑加载更多提示 */
        .load-more-tip {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            padding: 8px;
            width: 100%;
        }

        /* 新会话按钮 */
        #new-chat-btn {
            width: 36px;
            height: 36px;
            border: 1.5px solid #e2e8f0;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }
        #new-chat-btn:active {
            background: #f1f5f9;
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }
        #new-chat-btn svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 数字人展示层 -->
        <div id="live2d-zone">
            <div id="live2d-canvas-container"></div>
            <!-- 医生信息卡片 -->
            <div id="doctor-info">
                <div id="doctor-name">数字人医生</div>
                <div id="status-text">
                    <div id="status-dot"></div>
                    正在为您服务
                </div>
            </div>
        </div>
        
        <!-- 聊天交互层 -->
        <div id="chat-zone">
            <div id="message-list">
                <div class="msg ai">
                    <div class="bubble">你好，我是您的 AI 医疗小助手。请问有什么可以帮您？</div>
                </div>
            </div>
            
            <div class="disclaimer">AI 医疗建议仅供参考，不作为最终诊断</div>
            
            <div id="input-bar">
                <button id="new-chat-btn" title="新会话">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <input type="text" id="chat-input" placeholder="输入您的症状或问题..." autocomplete="off">
                <button id="send-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 脚本引用保持不变 -->
    <script src="/lib/live2dcubismcore.min.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
