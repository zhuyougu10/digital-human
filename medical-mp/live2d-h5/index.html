<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AI问诊</title>
    <style>
        :root {
            /* 医疗专业配色方案 */
            --primary-blue: #2563eb;
            --primary-light: #eff6ff;
            --medical-teal: #0d9488;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --bg-light: #f8faff;
            --glass-white: rgba(255, 255, 255, 0.85);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(37, 99, 235, 0.08);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.08);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #eef2f7;
            /* 柔和的医疗质感背景 */
            background-image: 
                radial-gradient(at 0% 0%, hsla(210, 100%, 98%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(190, 100%, 95%, 1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(220, 100%, 94%, 1) 0, transparent 50%);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 数字人展示区域 */
        #live2d-zone {
            height: 52vh;
            width: 100%;
            position: relative;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #live2d-canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: auto;
        }

        canvas {
            background: transparent !important;
        }

        /* 医生信息卡片 - 精致毛玻璃 */
        #doctor-info {
            position: absolute;
            top: 24px;
            right: 20px;
            z-index: 10;
            background: var(--glass-white);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            pointer-events: auto;
        }

        #doctor-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        #status-text {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            position: relative;
        }

        #status-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: inherit;
            animation: ripple 2s infinite;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* 聊天互动区域 */
        #chat-zone {
            flex: 1;
            background: white;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.04);
            position: relative;
            z-index: 2;
            margin-top: -30px;
        }

        /* 顶部拉手指示器 */
        #chat-zone::before {
            content: '';
            width: 36px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
        }

        #message-list {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        #message-list::-webkit-scrollbar {
            width: 0px;
        }

        /* 消息基础样式 */
        .msg {
            display: flex;
            max-width: 85%;
            animation: bubbleUp 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.1) forwards;
        }

        @keyframes bubbleUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg.ai {
            align-self: flex-start;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        /* 用户气泡 - 现代蓝渐变 */
        .user .bubble {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.15);
        }

        /* AI 气泡 - 纯净医疗白 */
        .ai .bubble {
            background: white;
            color: var(--text-main);
            border: 1px solid #f1f5f9;
            border-bottom-left-radius: 4px;
            /* AI 身份侧边装饰 */
            border-left: 4px solid var(--medical-teal);
        }

        /* 时间戳样式 */
        .msg-time {
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 4px;
            display: block;
            text-align: center;
            opacity: 0.7;
        }

        /* 输入区域设计 */
        #input-bar {
            padding: 12px 20px calc(12px + var(--safe-area-bottom));
            background: white;
            display: flex;
            gap: 12px;
            align-items: center;
            border-top: 1px solid #f1f5f9;
        }

        #chat-input {
            flex: 1;
            height: 44px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 22px;
            padding: 0 20px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #chat-input:focus {
            background: white;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.06);
        }

        #send-btn {
            width: 44px;
            height: 44px;
            background: var(--primary-blue);
            border: none;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            flex-shrink: 0;
        }

        #send-btn:active {
            transform: scale(0.9);
            filter: brightness(0.9);
        }

        #send-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: translateX(1px);
        }

        /* 正在输入动画 */
        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 4px;
            align-items: center;
        }

        .typing span {
            width: 5px;
            height: 5px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 免责声明提示 */
        .disclaimer {
            font-size: 10px;
            color: #94a3b8;
            text-align: center;
            padding: 4px 0;
            background: white;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 数字人展示层 -->
        <div id="live2d-zone">
            <div id="live2d-canvas-container"></div>
            <!-- 医生信息卡片 -->
            <div id="doctor-info">
                <div id="doctor-name">数字人医生</div>
                <div id="status-text">
                    <div id="status-dot"></div>
                    正在为您服务
                </div>
            </div>
        </div>
        
        <!-- 聊天交互层 -->
        <div id="chat-zone">
            <div id="message-list">
                <div class="msg ai">
                    <div class="bubble">你好，我是您的 AI 医疗小助手。请问有什么可以帮您？</div>
                </div>
            </div>
            
            <div class="disclaimer">AI 医疗建议仅供参考，不作为最终诊断</div>
            
            <div id="input-bar">
                <input type="text" id="chat-input" placeholder="输入您的症状或问题..." autocomplete="off">
                <button id="send-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 脚本引用保持不变 -->
    <script src="/lib/live2dcubismcore.min.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
